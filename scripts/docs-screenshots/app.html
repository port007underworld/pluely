<!doctype html>
<!--
  The real overlay UI with Tauri and the AI provider faked, for user-guide
  screenshots (the real overlay window is hidden from screen capture).
  Loaded by frame.html; see capture.mjs.
    ?scene=bar    collapsed overlay during a meeting
    ?scene=panel  answer panel with a streamed answer
    ?theme=dark|light
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Runningbord overlay</title>
    <style>
      html, body { background: transparent !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./mocks.js"></script>
    <script>
      const scene = new URLSearchParams(location.search).get("scene") || "bar";
      history.replaceState(null, "", "/");
      window.__docsReplies = [
        "Use a **token bucket per API key**, kept in Redis so every server shares the same counts.\n\n- Each key gets a bucket of *N* tokens that refills at a fixed rate; a request spends one token.\n- Out of tokens: return **429** with a `Retry-After` header.\n- Bursts are allowed up to the bucket size, which suits real client traffic.\n\n[[follow-ups]]\nHow would you handle limits across several regions?\nWhat happens if Redis goes down?\nHow do customers see how close they are to the limit?",
        "Do the check-and-spend **atomically in Redis** with a short Lua script, so two servers can't spend the same token:\n\n```python\nallowed = redis.eval(TOKEN_BUCKET_LUA, 1, f\"rl:{api_key}\",\n                     capacity, refill_per_sec, now)\nif not allowed:\n    raise TooManyRequests(retry_after=1)\n```\n\nIf Redis is unreachable, **fail open** with a small per-server limit, so an outage doesn't block every customer.\n\n[[follow-ups]]\nWhy fail open instead of closed?\nHow would you test this under load?",
      ];

      const { wait, until, type, ready } = window.__docs;
      // Drive the UI like a user: Meeting mode on, ask two questions, then (for the bar) close the panel.
      const ask = async (question) => {
        const input = await until(() => document.querySelector("input[placeholder]"));
        type(input, question);
        await wait(50);
        input.dispatchEvent(new KeyboardEvent("keypress", { key: "Enter", code: "Enter", charCode: 13, keyCode: 13, bubbles: true }));
        await until(() => [...document.querySelectorAll("button")].some((b) => b.textContent.trim() === "Shorter"));
        await wait(100);
      };
      window.addEventListener("load", async () => {
        await wait(600);
        const meeting = await until(() =>
          document.querySelector("button[aria-pressed] svg.lucide-audio-lines")?.closest("button")
        );
        if (meeting?.getAttribute("aria-pressed") === "false") meeting.click();
        await wait(400);
        await ask("How would you design a rate limiter for our public API?");
        await ask("How do you keep it consistent across servers?");
        if (scene === "bar") {
          document.querySelector('button[title="Close"]')?.click();
          await wait(1500);
        }
        ready(null);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
