<!doctype html>
<!-- Places app.html on a desktop-like background at the overlay's real size. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: flex-start; justify-content: center;
        padding-top: 28px; box-sizing: border-box;
        background: radial-gradient(120% 140% at 20% 0%, #334155 0%, #0f172a 55%, #020617 100%);
      }
      body.light { background: radial-gradient(120% 140% at 20% 0%, #e2e8f0 0%, #cbd5e1 55%, #94a3b8 100%); }
      iframe { border: 0; width: 600px; background: transparent; }
    </style>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.get("theme") === "light") document.body.classList.add("light");
      const frame = document.createElement("iframe");
      // The real window is 600 px wide, 54 px tall collapsed and 600 px open.
      frame.style.height = params.get("scene") === "panel" ? "600px" : "54px";
      frame.src = `app.html${location.search}`;
      frame.allowTransparency = true;
      document.body.appendChild(frame);
    </script>
  </body>
</html>
