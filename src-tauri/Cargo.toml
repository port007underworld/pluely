[package]
name = "runningbord"
version = "0.2.2"
description = "The Open Source Alternative to Cluely - A lightning-fast, privacy-first AI assistant that works seamlessly during meetings, interviews, and conversations without anyone knowing."
authors = ["Srikanth Nani <srikanthnani1202@gmail.com>"]
license = "GPL-3.0"
repository = "https://github.com/iamsrikanthnani/runningbord"
homepage = "https://github.com/iamsrikanthnani/runningbord"
documentation = "https://github.com/iamsrikanthnani/runningbord/wiki"
readme = "../README.md"
keywords = ["ai-assistant", "tauri", "desktop-app", "privacy-first", "meeting-assistant"]
categories = ["gui", "multimedia", "accessibility", "science", "development-tools"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "runningbord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.9.0"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2.5.2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.6"
xcap = "0.0.12"
base64 = "0.22"
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.19.0"
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
tauri-plugin-shell = "2.3.1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
ringbuf = "0.4"
ogg = "0.9"
opus = "0.3"
rfd = "0.15"
cpal = "0.15"
pdf-extract = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
whisper-rs = { version = "0.16", features = ["tracing_backend"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
objc2 = { version = "0.6", features = ["std"] }
objc2-core-audio = "0.3"
whisper-rs = { version = "0.16", features = ["metal"] }
# Speaker embeddings for telling remote speakers apart (static onnxruntime).
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSUUID", "NSValue", "alloc"] }



# Build scripts (e.g. sherpa-rs unpacking its prebuilt archive, whisper-rs) are
# otherwise compiled unoptimized and take minutes on a clean build.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
